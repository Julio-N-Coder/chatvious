[package]
name = "sign_up_in"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_runtime = "0.14.3"
serde = "1.0.219"
serde_json = "1"
rand = "0.8"
argon2 = "0.5"
uuid = { version = "1.18", features = ["v4", "rng"] }
tokio = { version = "1", features = ["macros"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
] }
aws-config = "1.8.5"
aws-credential-types = "1.2.5"
aws-sdk-dynamodb = "1.87.0"
